name: Materialize evidence test contract

on:
  push:
    branches:
      - fix/evidence-database-semantic-identifiers

permissions:
  contents: read

jobs:
  materialize_evidence_test_contract:
    if: github.repository == 'ContextualWisdomLab/semantic-data-portal'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update stale evidence-store test contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_api.py")
          test_text = test_path.read_text()
          replacements = {
              'SELECT payload FROM policy_decisions': 'SELECT decision_payload FROM policy_decisions',
              'SELECT payload FROM audit_events': 'SELECT audit_payload FROM audit_events',
              'assert "payload JSONB NOT NULL" in statements': (
                  'assert "decision_payload JSONB NOT NULL" in statements\n'
                  '    assert "audit_payload JSONB NOT NULL" in statements'
              ),
              'assert "idx_policy_decisions_tenant_resource_created" in statements': (
                  'assert "idx_policy_decisions_tenant_policy_resource_created" in statements'
              ),
              'assert "idx_audit_events_tenant_resource_created" in statements': (
                  'assert "idx_audit_events_tenant_audit_resource_created" in statements'
              ),
          }
          for old_text, new_text in replacements.items():
              occurrence_count = test_text.count(old_text)
              if occurrence_count != 1:
                  raise SystemExit(
                      f"expected one occurrence of {old_text!r}, found {occurrence_count}"
                  )
              test_text = test_text.replace(old_text, new_text)
          test_path.write_text(test_text)
          PY

      - name: Verify focused evidence-store contracts
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements-test.txt
          PYTHONPATH=src pytest \
            tests/test_evidence_store_database_naming.py \
            tests/test_api.py -q

      - name: Reconcile remote head and push ordinary successor commit
        shell: bash
        env:
          REPAIR_BRANCH_NAME: ${{ github.ref_name }}
          WORKFLOW_PATH: .github/workflows/materialize-evidence-test-contract.yml
        run: |
          git fetch origin "${REPAIR_BRANCH_NAME}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${REPAIR_BRANCH_NAME}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_api.py
          git rm "${WORKFLOW_PATH}"
          git commit -m "test(evidence): align integration contract with semantic columns"
          git push origin "HEAD:${REPAIR_BRANCH_NAME}"
