name: Semantic Evidence Test Repair

on:
  push:
    branches:
      - fix/dataset-distribution-semantic-identifiers

permissions:
  contents: write

concurrency:
  group: semantic-evidence-test-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair_test_contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify unchanged branch authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Update stale Postgres fake assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_api.py")
          test_source = test_path.read_text()
          replacements = {
              'if "SELECT payload FROM policy_decisions" in sql:': 'if "SELECT decision_payload FROM policy_decisions" in sql:',
              'elif "SELECT payload FROM audit_events" in sql:': 'elif "SELECT audit_payload FROM audit_events" in sql:',
              '    assert "payload JSONB NOT NULL" in statements\n': (
                  '    assert "decision_payload JSONB NOT NULL" in statements\n'
                  '    assert "audit_payload JSONB NOT NULL" in statements\n'
              ),
          }
          for legacy_text, semantic_text in replacements.items():
              occurrence_count = test_source.count(legacy_text)
              if occurrence_count != 1:
                  raise SystemExit(
                      f"expected exactly one stale contract occurrence for {legacy_text!r}; "
                      f"found {occurrence_count}"
                  )
              test_source = test_source.replace(legacy_text, semantic_text, 1)
          test_path.write_text(test_source)
          PY

      - name: Remove one-shot repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/semantic-evidence-test-repair.yml

      - name: Commit ordinary-history repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- tests/test_api.py && exit 1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_api.py
          git add -u .github/workflows/semantic-evidence-test-repair.yml
          git commit -m "test(db): align evidence-store fake with semantic columns"
          git fetch origin "${GITHUB_REF_NAME}"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
