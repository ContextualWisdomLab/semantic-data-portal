name: Exact-head SAST

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: exact-head-sast-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep exact pull-request head
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.13.2
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact pull-request head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Run pinned Semgrep gate
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            -e SEMGREP_SEND_METRICS=off \
            --entrypoint semgrep \
            semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942 \
            scan \
            --config=p/default \
            --severity=WARNING \
            --severity=ERROR \
            --exclude=.github/workflows \
            --exclude='docs/research/**/standards' \
            --error \
            --metrics=off
