name: One-shot refresh cryptography locks

on:
  push:
    branches: [feat/measurement-context-registry]
    paths:
      - '.github/workflows/one-shot-refresh-cryptography-locks.yml'

permissions:
  contents: read

jobs:
  refresh-locks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/measurement-context-registry
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned lock generator
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'uv==0.8.15'
      - name: Regenerate hashed lock files
        run: |
          set -euo pipefail
          uv pip compile pyproject.toml --generate-hashes --universal --python-version 3.12 -o requirements.txt
          uv pip compile pyproject.toml --extra dev --generate-hashes --universal --python-version 3.12 -o requirements-dev.txt
          uv pip compile --generate-hashes --universal --python-version 3.12 requirements-test.in -o requirements-test.txt
          uv pip compile pyproject.toml --extra graph --constraint constraints-graph.txt --generate-hashes --universal --python-version 3.12 -o requirements-graph.txt
          grep -q '^cryptography==50\.0\.1 ' requirements.txt
          grep -q '^cryptography==50\.0\.1 ' requirements-dev.txt
          grep -q '^cryptography==50\.0\.1 ' requirements-test.txt
          grep -q '^cryptography==50\.0\.1 ' requirements-graph.txt
          ! grep -R '^cryptography==49\.0\.0' requirements*.txt
      - name: Verify product tests with refreshed test lock
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
          PYTHONPATH=src python -m pytest
      - name: Remove one-shot workflow and commit generated locks
        run: |
          rm .github/workflows/one-shot-refresh-cryptography-locks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.txt requirements-dev.txt requirements-test.txt requirements-graph.txt .github/workflows/one-shot-refresh-cryptography-locks.yml
          if git diff --cached --quiet; then
            exit 1
          fi
          git commit -m 'fix(security): refresh patched cryptography locks'
          git push origin HEAD:feat/measurement-context-registry
