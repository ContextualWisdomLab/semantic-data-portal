name: Temporary cryptography lock refresh

on:
  push:
    branches:
      - "claude/inkspan-pr-audit-ci-q1u4uj"

permissions:
  contents: write

concurrency:
  group: temporary-cryptography-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-locks:
    if: >-
      github.repository == 'ContextualWisdomLab/semantic-data-portal' &&
      github.ref == 'refs/heads/claude/inkspan-pr-audit-ci-q1u4uj'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.14.2
        with:
          egress-policy: audit
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install immutable uv compiler
        shell: bash
        run: |
          cat >"${RUNNER_TEMP}/uv-lock-refresh.txt" <<'EOF'
          uv==0.11.25 \
              --hash=sha256:2c1cfe97dce56c997dfa3214bdb8955b7b34cceea7505520185e22ad99c0eb6b \
              --hash=sha256:3febca65ec5bc336ddaf7e4f724704f2c894c16839723df14865ee00b4acf38d \
              --hash=sha256:41b37e724f41eb4c3794bbdd82ddeebb4b5850d4ada8cccb2906ef9e5aa0f83b \
              --hash=sha256:458e731778e7b5cc870710397859c23e766703e7bc0695f23b3eb15080745ba6 \
              --hash=sha256:560b0fbaa6356af533923a349658c21d4f410d16e835787d8a05da451d4ee859 \
              --hash=sha256:57fbd47e924242fd347d0c209d95711d8ea61db8d8780962d0f30ccde2c854a3 \
              --hash=sha256:610650cbaa0a9b18015da39d2c28d736d287a5a124e49296d8fdef5e4022e980 \
              --hash=sha256:61ef11d9967a38109e6e8e3d20d1f743fa08033c32bce274d6ccd9a9abb5d305 \
              --hash=sha256:69d14ffd0a4b050f8a70f64aacb09b8dfdfb1cb30a6351fb17b48f273f95c58c \
              --hash=sha256:79f166cd1b84f855e9d2768221d59b403869648289fd884d58ad4299edfb4d9e \
              --hash=sha256:850ba0018ff170c3a9baaf9b5fe8b23393b6b77ee4ea6b2e2315fdb8d7c388f7 \
              --hash=sha256:86d4759fec9b46f61944d6e9ef1f5eaa2c5fbe2db5ddb59492d9174b08fcf39c \
              --hash=sha256:b180b12237b4e04692491fc6796584a9a8bdf4c7332bd2a769caf096b97885d0 \
              --hash=sha256:d2bc05e17ae3e1f232abf93e7dcfb3b68702dfcde34a00c29cbce7e07d1ecbfb \
              --hash=sha256:d6f965a79fc7539a12139ce981caa0cbf7d9d3bd4ea3daadaf174ab4d7fb6e42 \
              --hash=sha256:e3480640983e0b8e509eeb67882837e620bdd820f8776948a5f13ebbb4481d04 \
              --hash=sha256:f42de9e7d63a28a4fe76a522077813656de38b5acda20b4db63857d260c1ff13 \
              --hash=sha256:f7a78fc8d0c5e764e9fa39c99066db47a0bc465b023feed90812e3c0a6b5eb0d \
              --hash=sha256:fbff70ae9fa4da9fb6823ae4fdaf77a65c9520e13b6d1d0241ba56e4b121b7aa
          EOF
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r "${RUNNER_TEMP}/uv-lock-refresh.txt"
      - name: Regenerate hash-locked dependency surfaces
        shell: bash
        run: |
          uv pip compile pyproject.toml --generate-hashes -o requirements.txt
          uv pip compile pyproject.toml --extra dev --generate-hashes -o requirements-dev.txt
          uv pip compile --generate-hashes --universal --python-version 3.12 \
            requirements-test.in -o requirements-test.txt
          for lock_file in requirements.txt requirements-dev.txt requirements-test.txt; do
            test "$(grep -c '^cryptography==50\.0\.0 ' "${lock_file}")" -eq 1
            ! grep -q '^cryptography==49\.0\.0 ' "${lock_file}"
          done
          python -m pytest -q tests/test_dependency_security.py
          git diff --check
      - name: Publish generated locks and remove materializer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          rm .github/workflows/temporary-cryptography-lock-refresh.yml
          git add requirements.txt requirements-dev.txt requirements-test.txt \
            .github/workflows/temporary-cryptography-lock-refresh.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Lock files already match the patched dependency graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): regenerate patched dependency locks"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "${remote_head}" = "${EXPECTED_HEAD_SHA}"
          authorization="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" \
            push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
