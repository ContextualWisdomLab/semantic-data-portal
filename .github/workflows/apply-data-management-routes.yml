name: Apply data-management routes

on:
  push:
    branches: [feat/data-management-evidence-profile]

permissions:
  contents: write

concurrency:
  group: apply-data-management-routes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/data-management-evidence-profile
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Apply bounded API registration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          api_path = Path("src/sdp/api.py")
          source = api_path.read_text(encoding="utf-8")
          endpoint_marker = '"/plane/catalog-objects/{catalog_object_id}/data-management-profile"'

          if endpoint_marker not in source:
              core_import = '''from sdp_core.data_management_evidence import (
              CriticalDataElementDraft,
              DataOwnerAssignmentDraft,
              DataQualityObservationDraft,
              DataQualityRuleDraft,
          )
          '''
              import_anchor = "from sdp_core.catalog_plane import (\n"
              if import_anchor not in source:
                  raise SystemExit("catalog-plane import anchor not found")
              source = source.replace(import_anchor, core_import + import_anchor, 1)

              service_import = '''from .data_management_evidence import (
              assign_data_owner,
              build_data_management_profile,
              define_data_quality_rule,
              record_data_quality_observation,
              register_critical_data_element,
          )
          '''
              service_anchor = "from .config import get_app_config\n"
              if service_anchor not in source:
                  raise SystemExit("config import anchor not found")
              source = source.replace(service_anchor, service_import + service_anchor, 1)

              route_anchor = '@app.get("/ontology/term/{term}/graph")\n'
              if route_anchor not in source:
                  raise SystemExit("ontology route anchor not found")
              routes = '''@app.post("/plane/catalog-objects/{catalog_object_id}/data-owner-assignments")
          def plane_assign_data_owner(
              catalog_object_id: str,
              payload: DataOwnerAssignmentDraft,
              request: Request,
          ) -> dict[str, Any]:
              """Assign an evidence-backed data owner to one catalog object."""

              actor = _plane_actor(request)
              try:
                  return assign_data_owner(actor, catalog_object_id, payload).model_dump()
              except PermissionError as exc:
                  raise HTTPException(status_code=403, detail=str(exc)) from exc
              except KeyError as exc:
                  raise HTTPException(status_code=404, detail=str(exc)) from exc
              except ValueError as exc:
                  raise HTTPException(status_code=400, detail=str(exc)) from exc


          @app.post("/plane/catalog-objects/{catalog_object_id}/critical-data-elements")
          def plane_register_critical_data_element(
              catalog_object_id: str,
              payload: CriticalDataElementDraft,
              request: Request,
          ) -> dict[str, Any]:
              """Register an evidence-backed CDE under a catalog dataset."""

              actor = _plane_actor(request)
              try:
                  return register_critical_data_element(
                      actor,
                      catalog_object_id,
                      payload,
                  ).model_dump()
              except PermissionError as exc:
                  raise HTTPException(status_code=403, detail=str(exc)) from exc
              except KeyError as exc:
                  raise HTTPException(status_code=404, detail=str(exc)) from exc
              except ValueError as exc:
                  raise HTTPException(status_code=400, detail=str(exc)) from exc


          @app.post("/plane/critical-data-elements/{critical_data_element_id}/quality-rules")
          def plane_define_data_quality_rule(
              critical_data_element_id: str,
              payload: DataQualityRuleDraft,
              request: Request,
          ) -> dict[str, Any]:
              """Define one evidence-backed quality rule for a CDE."""

              actor = _plane_actor(request)
              try:
                  return define_data_quality_rule(
                      actor,
                      critical_data_element_id,
                      payload,
                  ).model_dump()
              except PermissionError as exc:
                  raise HTTPException(status_code=403, detail=str(exc)) from exc
              except KeyError as exc:
                  raise HTTPException(status_code=404, detail=str(exc)) from exc
              except ValueError as exc:
                  raise HTTPException(status_code=400, detail=str(exc)) from exc


          @app.post("/plane/quality-rules/{data_quality_rule_id}/observations")
          def plane_record_data_quality_observation(
              data_quality_rule_id: str,
              payload: DataQualityObservationDraft,
              request: Request,
          ) -> dict[str, Any]:
              """Append one immutable evidence-backed quality observation."""

              actor = _plane_actor(request)
              try:
                  return record_data_quality_observation(
                      actor,
                      data_quality_rule_id,
                      payload,
                  ).model_dump()
              except PermissionError as exc:
                  raise HTTPException(status_code=403, detail=str(exc)) from exc
              except KeyError as exc:
                  raise HTTPException(status_code=404, detail=str(exc)) from exc
              except ValueError as exc:
                  raise HTTPException(status_code=400, detail=str(exc)) from exc


          @app.get("/plane/catalog-objects/{catalog_object_id}/data-management-profile")
          def plane_data_management_profile(
              catalog_object_id: str,
              request: Request,
          ) -> dict[str, Any]:
              """Return the explainable evidence-completeness profile."""

              actor = _plane_actor(request)
              try:
                  return build_data_management_profile(actor, catalog_object_id).model_dump()
              except PermissionError as exc:
                  raise HTTPException(status_code=403, detail=str(exc)) from exc
              except KeyError as exc:
                  raise HTTPException(status_code=404, detail=str(exc)) from exc
              except ValueError as exc:
                  raise HTTPException(status_code=400, detail=str(exc)) from exc


          '''
              source = source.replace(route_anchor, routes + route_anchor, 1)
              api_path.write_text(source, encoding="utf-8")

          workflow_path = Path(".github/workflows/apply-data-management-routes.yml")
          workflow_path.unlink()
          PY
      - name: Install hash-pinned test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Verify focused data-management acceptance
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/test_data_management_evidence.py tests/test_data_management_migration.py
          python -m compileall -q src
      - name: Commit verified patch and remove one-shot workflow
        run: |
          git config user.name "cwl-data-management-agent"
          git config user.email "cwl-data-management-agent@users.noreply.github.com"
          git add src/sdp/api.py .github/workflows/apply-data-management-routes.yml
          git commit -m "feat: expose data management evidence routes"
          git push origin HEAD:feat/data-management-evidence-profile
