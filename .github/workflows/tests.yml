name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: API integration suite and 100% production coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact pull-request head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        # Hash-pinned from the authoritative test lock generated by:
        # uv pip compile --generate-hashes --universal --python-version 3.12 requirements-test.in -o requirements-test.txt
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Verify security dependency version
        run: test "$(python -c 'from importlib.metadata import version; print(version("cryptography"))')" = "50.0.0"
      - name: Run tests and enforce production statement and branch coverage
        run: |
          python -m coverage run --branch --source=sdp -m pytest
          python -m coverage report --show-missing --fail-under=100
        env:
          PYTHONPATH: src
