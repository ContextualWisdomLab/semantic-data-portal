name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Exact-head security, API suite, and changed-production coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact pull-request head
        if: github.event_name == 'pull_request'
        env:
          SDP_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SDP_EXPECTED_HEAD_SHA"
      - name: Run exact-head Semgrep gate
        env:
          SEMGREP_SEND_METRICS: off
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            -e SEMGREP_SEND_METRICS=off \
            --entrypoint semgrep \
            semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942 \
            scan \
            --config=p/default \
            --severity=WARNING \
            --severity=ERROR \
            --exclude='docs/research/**/standards' \
            --error \
            --metrics=off
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        # Hash-pinned from the authoritative test lock generated by:
        # uv pip compile --generate-hashes --universal --python-version 3.12 requirements-test.in -o requirements-test.txt
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Verify security dependency version
        run: test "$(python -c 'from importlib.metadata import version; print(version("cryptography"))')" = "50.0.0"
      - name: Run full test suite with branch coverage
        run: |
          python -m coverage run --branch --source=src -m pytest
          python -m coverage report --show-missing
          python -m coverage json -o coverage.json
        env:
          PYTHONPATH: src
      - name: Enforce 100% coverage on changed production code
        if: github.event_name == 'pull_request'
        env:
          SDP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SDP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/check_diff_coverage.py \
            --coverage-json coverage.json \
            --base-sha "$SDP_BASE_SHA" \
            --head-sha "$SDP_HEAD_SHA"

  api_integration_suite:
    name: API integration suite
    needs: pytest
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require complete API and security suite
        env:
          SDP_PYTEST_RESULT: ${{ needs.pytest.result }}
        run: test "$SDP_PYTEST_RESULT" = "success"
