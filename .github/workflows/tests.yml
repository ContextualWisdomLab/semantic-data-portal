name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: API integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact pull-request head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        # Hash-pinned from the authoritative development/test lock generated by:
        # uv pip compile pyproject.toml --extra dev --generate-hashes -o requirements-dev.txt
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Verify security dependency version
        run: test "$(python -c 'from importlib.metadata import version; print(version("cryptography"))')" = "50.0.0"
      - name: Run tests
        run: python -m pytest
        env:
          PYTHONPATH: src
