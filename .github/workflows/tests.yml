name: Tests

on:
  push:
    branches: [main]
  # Deliberately unfiltered. A `branches:` filter here matches the pull
  # request's *base*, and this repository stacks PRs on each other, so
  # `branches: [main]` produced no check run at all on every stacked PR -
  # measured on #102 (base: the #79 branch), which carried 2 check runs, both
  # from fuzz.yml, and no API integration suite result. fuzz.yml was already
  # unfiltered, which is why one lane appeared and the other did not.
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: API integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        # Hash-pinned per OpenSSF Scorecard Pinned-Dependencies; mirrors the
        # pins in pyproject.toml. Recompile with:
        # uv pip compile --generate-hashes --universal --python-version 3.12 requirements-test.in -o requirements-test.txt
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Run tests
        run: python -m pytest
        env:
          PYTHONPATH: src
